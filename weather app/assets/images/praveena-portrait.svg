  <ellipse cx="200" cy="186" rx="34" ry="40" fill="#D4A373" />
  <!-- Hair fringe -->
  <path d="M166 178 C170 150, 192 146, 208 148 C224 150, 234 162, 234 178 C220 166, 204 164, 188 168 C178 170, 170 174, 166 178 Z" fill="#182028" />

