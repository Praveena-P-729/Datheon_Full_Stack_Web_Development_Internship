  <!-- Subtle architectural grid lines -->
  <g stroke="#34404A" stroke-width="1" opacity="0.55">
    <line x1="0" y1="88" x2="400" y2="88" />
    <line x1="0" y1="176" x2="400" y2="176" />
    <line x1="0" y1="264" x2="400" y2="264" />
    <line x1="0" y1="352" x2="400" y2="352" />
